set-option -s default-terminal "xterm-256color"
#export TMUX_PLUGIN_MANAGER_PATH=~/.tmux/plugins

# --- TPM Bootstrap (if not installed) ---
if-shell "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# --- List of Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-nested'            # Helps with nested tmux sessions
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Highlights when prefix is active
set -g @plugin 'tmux-plugins/tmux-logging'          # Easy logging of pane output

# Set Prefix to Ctrl + A
set -g prefix C-a

# Vim-style pane navigation
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind | split-window -h
bind - split-window -v


# Theme Settings
#set -g @dracula-plugins "custom:ips.sh battery time"
set -g @dracula-plugins "custom:../../../ips.sh battery time"
set -g @dracula-show-empty-plugins false
set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg true

# Battery & Time Settings
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true
set -g @dracula-military-time true

# UI Customization
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-left-icon "#h | #S"

# Fix Copy Mode (Scroll Mode) Colors for Dracula
setw -g mode-style "bg=#282a36,fg=#f8f8f2"
setw -g message-style "bg=#44475a,fg=#f8f8f2"
setw -g message-command-style "bg=#6272a4,fg=#f8f8f2"

# Status Bar Position
set -g status-position bottom

# --- Initialize TPM ---
run '~/.tmux/plugins/tpm/tpm'



# --- Auto-install Plugins (Optional) ---
if-shell "[ -x ~/.tmux/plugins/tpm/bin/install_plugins ]" \
  "run '~/.tmux/plugins/tpm/bin/install_plugins'"

